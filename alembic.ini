# A generic, single database configuration for bragi.

[alembic]
# Package-relative form: alembic resolves this via importlib.resources
# so it works from any working directory -- including from a pip-installed
# bragi-cms wheel where there is no project root with a bare alembic/
# directory. The `bragi:alembic` form is supported from alembic >=1.7.
script_location = bragi:alembic

file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

timezone = UTC

truncate_slug_length = 40

revision_environment = false

sourceless = false

output_encoding = utf-8

# Dev default; the alembic env.py overrides from BRAGI_DATABASE_URL.
sqlalchemy.url = sqlite:///bragi.db


[post_write_hooks]
# Apply ruff's auto-fixers (imports, modern syntax) and then format
# generated revisions. Invoked as an executable rather than as a
# console_scripts entry-point to dodge a Python 3.14 lookup quirk
# in alembic.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
