name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - "release/**"
      - "hotfix/**"

# Minimum permissions. CI runs untrusted PR code (`poetry install`
# from a fork can execute arbitrary code in the build phase), so
# the workflow token must not carry write permissions on repo
# contents, packages, or anything else by default.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff check)
        run: poetry run ruff check src/ tests/ alembic/

      - name: Format check (ruff format)
        run: poetry run ruff format --check src/ tests/ alembic/

      - name: Type check (mypy)
        run: poetry run mypy src/

      - name: Test (pytest)
        run: poetry run pytest

      - name: Migration smoke (fresh DB)
        run: |
          rm -f bragi.db bragi.db-wal bragi.db-shm
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head
