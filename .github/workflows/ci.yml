name: CI

on:
  # CI is the pull-request gate: the full test job (ruff check +
  # format check + mypy + pytest + migration smoke) on every PR to
  # develop or main. It runs on NO branch push. release/** and
  # hotfix/** code is gated by its PR to main; the release publish
  # (PyPI + docker + notify-themes) lives in release.yml on the
  # GitHub Release, which trusts this gate. (develop is a loose
  # integration branch; main is the PR-gated release branch.)
  pull_request:
    branches:
      - develop
      - main

# Minimum permissions. CI runs untrusted PR code (`uv sync`
# from a fork can execute arbitrary code in the build phase), so
# the workflow token must not carry write permissions on repo
# contents, packages, or anything else by default.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/ alembic/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ tests/ alembic/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Test (pytest)
        run: uv run pytest

      - name: Migration smoke (fresh DB)
        run: |
          rm -f bragi.db bragi.db-wal bragi.db-shm
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
