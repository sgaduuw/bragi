name: Publish Release Artifacts

on:
  release:
    types: [published]

# Trusted Publishers via OIDC for PyPI; GHCR via GITHUB_TOKEN.
# PyPI side requires the pending publisher to be configured; see
# _claude/MEMORY.md for the one-time setup steps.

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bragi-cms/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Build sdist + wheel
        run: poetry build

      - name: Verify build artefacts
        run: |
          ls -lh dist/
          test -f dist/*.tar.gz
          test -f dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  publish-docker:
    needs: publish-pypi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [admin, delivery]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # PyPI publish job succeeded but the CDN may take a few seconds
      # to surface the new version on the install path. Poll until it's
      # reachable so the subsequent `pip install` inside Docker doesn't
      # race the propagation.
      # PyPI's JSON endpoint returns 200 well before `pip install` can
      # resolve the wheel from every CDN node. v1.27.2's publish-docker
      # failed at ~60s; doubling the budget gives the slow nodes time.
      - name: Wait for PyPI propagation
        run: |
          for i in $(seq 1 60); do
            if curl -fsSI "https://pypi.org/pypi/bragi-cms/${{ steps.version.outputs.version }}/json" > /dev/null 2>&1; then
              echo "bragi-cms==${{ steps.version.outputs.version }} reachable on PyPI"
              exit 0
            fi
            sleep 2
          done
          echo "PyPI did not surface bragi-cms==${{ steps.version.outputs.version }} after 120s"
          exit 1

      # QEMU registers binfmt handlers for foreign architectures
      # so the amd64 runner can execute arm64 build steps under
      # emulation. Required for the `linux/arm64` target on the
      # build-push step below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # `flavor: latest=auto` only adds `:latest` for non-
          # prerelease semver tags. Caveat: a hotfix off an older
          # lineage would still claim `:latest`; operators cutting
          # such hotfixes must manually re-tag `:latest` afterwards
          # if needed.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          # Both Dockerfiles consume the same multi-arch wheel from
          # PyPI; the dep tree ships arm64 wheels too. Tag push job
          # only; no per-PR builds, so the longer build time (~2x
          # amd64-only under QEMU emulation) is paid only on release.
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRAGI_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
