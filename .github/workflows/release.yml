name: Publish Release Artifacts

on:
  release:
    types: [published]

# Trusted Publishers via OIDC for PyPI; GHCR via GITHUB_TOKEN.
# PyPI side requires the pending publisher to be configured; see
# _claude/MEMORY.md for the one-time setup steps.

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bragi-cms/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist + wheel
        run: uv build

      - name: Verify build artefacts
        run: |
          ls -lh dist/
          test -f dist/*.tar.gz
          test -f dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  publish-docker:
    needs: publish-pypi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [admin, delivery]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The publish-pypi job above succeeded, but the pip resolver
      # behind `pip install` lags PyPI's JSON metadata at busy CDN
      # nodes. v1.27.2, v1.27.4, and v1.27.5 all saw the docker job's
      # `pip install` race the propagation while the old probe (curl
      # against the JSON endpoint) already reported 200. Probe with
      # pip itself so the gate exercises the same resolver path the
      # docker build is about to take; only when pip can actually
      # resolve AND fetch the wheel do we proceed. The temporary
      # download directory is discarded; this step does not pre-warm
      # any pip cache the docker build reads.
      - name: Wait for PyPI propagation
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for i in $(seq 1 60); do
            rm -rf /tmp/pypi-check
            mkdir -p /tmp/pypi-check
            if python3 -m pip download \
                --no-deps \
                --quiet \
                --dest /tmp/pypi-check \
                "bragi-cms==${VERSION}" 2>/dev/null; then
              echo "bragi-cms==${VERSION} resolvable on PyPI (attempt ${i})"
              rm -rf /tmp/pypi-check
              exit 0
            fi
            echo "attempt ${i}: bragi-cms==${VERSION} not yet resolvable on PyPI"
            sleep 10
          done
          echo "PyPI did not surface bragi-cms==${VERSION} after 600s; check publish-pypi step output and re-run this job"
          exit 1

      # QEMU registers binfmt handlers for foreign architectures
      # so the amd64 runner can execute arm64 build steps under
      # emulation. Required for the `linux/arm64` target on the
      # build-push step below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # `flavor: latest=auto` only adds `:latest` for non-
          # prerelease semver tags. Caveat: a hotfix off an older
          # lineage would still claim `:latest`; operators cutting
          # such hotfixes must manually re-tag `:latest` afterwards
          # if needed.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          # Both Dockerfiles consume the same multi-arch wheel from
          # PyPI; the dep tree ships arm64 wheels too. Tag push job
          # only; no per-PR builds, so the longer build time (~2x
          # amd64-only under QEMU emulation) is paid only on release.
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRAGI_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  notify-themes:
    needs: publish-docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false           # one theme failing must not block siblings
      matrix:
        theme:
          - bragi-theme-zelda
    steps:
      - name: Mint App installation token
        uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.THEME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.THEME_DISPATCH_APP_KEY }}
          owner: sgaduuw
          repositories: ${{ matrix.theme }}

      - name: Resolve version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Dispatch bragi-released
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api \
            -X POST \
            /repos/sgaduuw/${{ matrix.theme }}/dispatches \
            -f event_type=bragi-released \
            -F 'client_payload[version]=${{ steps.version.outputs.version }}'
          echo "Dispatched bragi-released v${{ steps.version.outputs.version }} to sgaduuw/${{ matrix.theme }}"
