name: Publish Release Artifacts

on:
  release:
    types: [published]
  # workflow_dispatch is the operator-recovery path for cases where
  # publish-pypi succeeded but publish-docker exhausted its PyPI
  # propagation budget (matrix runners can hit a CDN edge stuck
  # behind pypi.org's primary node by tens of minutes; see v1.31.0
  # for the incident that prompted this trigger). Dispatch with the
  # already-published version to re-fire publish-docker alone;
  # publish-pypi self-skips on this path so PyPI is not re-uploaded.
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-published version to re-fire publish-docker for (no v prefix, e.g. 1.31.0).'
        required: true
        type: string

# Trusted Publishers via OIDC for PyPI; GHCR via GITHUB_TOKEN.
# PyPI side requires the pending publisher to be configured; see
# _claude/MEMORY.md for the one-time setup steps.

jobs:
  publish-pypi:
    # release-only: the dispatch path is for re-firing publish-docker
    # against an already-published version; no need to re-upload.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bragi-cms/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist + wheel
        run: uv build

      - name: Verify build artefacts
        run: |
          ls -lh dist/
          test -f dist/*.tar.gz
          test -f dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  publish-docker:
    needs: publish-pypi
    # Runs on the release path when publish-pypi succeeds, and on the
    # workflow_dispatch path when publish-pypi self-skipped. `always()`
    # is required so the skipped publish-pypi doesn't propagate the
    # skip into here.
    if: |
      always() && (
        (github.event_name == 'release' && needs.publish-pypi.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.publish-pypi.result == 'skipped')
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [admin, delivery]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # The propagation gate below uses `python3 -m pip download`
      # against the pinned bragi-cms version. pip honours the
      # `Requires-Python` constraint advertised on the simple index,
      # so this Python MUST satisfy the bragi-cms floor: ubuntu-latest
      # currently ships Python 3.12.3 by default, and v1.31.0 raised
      # the floor to 3.14, which would make pip silently refuse to
      # resolve the just-published wheel (the error reads
      # `Could not find a version that satisfies` and looks identical
      # to a propagation lag). Pin a Python that satisfies the floor.
      # If the bragi-cms floor moves again, bump this too.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Resolve version
        id: version
        # Sources the version from the release tag on the release-event
        # path and from the dispatch input on the recovery path.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The publish-pypi job above succeeded, but the pip resolver
      # behind `pip install` can lag PyPI's JSON metadata at busy
      # CDN nodes. v1.27.2, v1.27.4, and v1.27.5 all saw the docker
      # job's `pip install` race the propagation while the old probe
      # (curl against the JSON endpoint) already reported 200. Probe
      # with pip itself so the gate exercises the same resolver path
      # the docker build is about to take; only when pip can actually
      # resolve AND fetch the wheel do we proceed. The temporary
      # download directory is discarded; this step does not pre-warm
      # any pip cache the docker build reads.
      - name: Wait for PyPI propagation
        # Budget is 1800s (180 x 10s). The 600s ceiling stood from
        # v1.27.6 through v1.31.0; the v1.31.0 incident that
        # raised it to 1800s turned out to be a Python-version skew
        # in this very gate (the setup-python step above is the
        # actual fix), not CDN-side lag. The wider budget is kept
        # as belt-and-suspenders for genuine CDN outliers.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for i in $(seq 1 180); do
            rm -rf /tmp/pypi-check
            mkdir -p /tmp/pypi-check
            if python3 -m pip download \
                --no-deps \
                --quiet \
                --dest /tmp/pypi-check \
                "bragi-cms==${VERSION}" 2>/dev/null; then
              echo "bragi-cms==${VERSION} resolvable on PyPI (attempt ${i})"
              rm -rf /tmp/pypi-check
              exit 0
            fi
            echo "attempt ${i}: bragi-cms==${VERSION} not yet resolvable on PyPI"
            sleep 10
          done
          echo "PyPI did not surface bragi-cms==${VERSION} after 1800s; check publish-pypi step output and re-run this job"
          exit 1

      # QEMU registers binfmt handlers for foreign architectures
      # so the amd64 runner can execute arm64 build steps under
      # emulation. Required for the `linux/arm64` target on the
      # build-push step below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # `flavor: latest=auto` only adds `:latest` for non-
          # prerelease semver tags. Caveat: a hotfix off an older
          # lineage would still claim `:latest`; operators cutting
          # such hotfixes must manually re-tag `:latest` afterwards
          # if needed.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          # Both Dockerfiles consume the same multi-arch wheel from
          # PyPI; the dep tree ships arm64 wheels too. Tag push job
          # only; no per-PR builds, so the longer build time (~2x
          # amd64-only under QEMU emulation) is paid only on release.
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRAGI_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  notify-themes:
    needs: publish-docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false           # one theme failing must not block siblings
      matrix:
        theme:
          - bragi-theme-zelda
    steps:
      - name: Mint App installation token
        uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.THEME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.THEME_DISPATCH_APP_KEY }}
          owner: sgaduuw
          repositories: ${{ matrix.theme }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Dispatch bragi-released
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api \
            -X POST \
            /repos/sgaduuw/${{ matrix.theme }}/dispatches \
            -f event_type=bragi-released \
            -F 'client_payload[version]=${{ steps.version.outputs.version }}'
          echo "Dispatched bragi-released v${{ steps.version.outputs.version }} to sgaduuw/${{ matrix.theme }}"
