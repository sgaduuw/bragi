name: Build and publish Docker images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - admin
          - delivery
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # `flavor: latest=auto` only adds `:latest` for non-
          # prerelease semver tags (e.g. `v1.12.0` -> latest, but
          # `v1.12.0-rc1` does NOT). Caveat: a hotfix cut off an
          # older lineage (say, `v1.10.5` after `v1.11.0` already
          # shipped) would still claim `:latest` here because the
          # action compares the tag pattern, not the tag ordering
          # against the registry. Operators cutting hotfixes off
          # older majors must manually re-tag `:latest` afterwards
          # if needed.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
