name: Build and publish Docker images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - admin
          - delivery
    steps:
      - uses: actions/checkout@v6

      # QEMU registers binfmt handlers for foreign architectures
      # so the amd64 runner can execute arm64 build steps under
      # emulation. Required for the `linux/arm64` target on the
      # build-push step below; without it buildx errors with
      # `exec format error` the moment it tries to run anything
      # inside the arm64 image. The action is idempotent.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # `flavor: latest=auto` only adds `:latest` for non-
          # prerelease semver tags (e.g. `v1.12.0` -> latest, but
          # `v1.12.0-rc1` does NOT). Caveat: a hotfix cut off an
          # older lineage (say, `v1.10.5` after `v1.11.0` already
          # shipped) would still claim `:latest` here because the
          # action compares the tag pattern, not the tag ordering
          # against the registry. Operators cutting hotfixes off
          # older majors must manually re-tag `:latest` afterwards
          # if needed.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          # Both Dockerfiles are arch-agnostic (`python:3.12-slim`
          # is a multi-arch manifest list, every runtime dep ships
          # arm64 wheels) so buildx produces a single manifest-list
          # tag covering both platforms. `docker pull` on either
          # host architecture resolves automatically. Tag push job
          # only; no per-PR builds, so the longer build time
          # (roughly 2x amd64-only under QEMU emulation) is paid
          # only on release. Multi-arch ship was filed as #167.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
