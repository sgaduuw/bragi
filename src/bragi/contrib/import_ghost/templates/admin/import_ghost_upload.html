{% extends "admin/base.html" %}
{% block title %}Import from Ghost &middot; bragi admin{% endblock %}
{% block content %}
<h1>Import from Ghost</h1>

<p>Upload your Ghost JSON export or a ZIP containing it. You will be
   taken to a review page before anything is written to the database.</p>

<style>
  /* `admin-chrome.css:192` makes every form `display: flex;
     flex-direction: column`, which stretches submit buttons to
     the column's full width. Constrain this form's button to its
     natural width and left-align it so it reads as a normal "go"
     action instead of a giant bar. Button colors come from the
     global `form button` rule (dark pill). */
  .ghost-import-upload button[type="submit"] {
    align-self: flex-start;
  }
</style>
<form class="ghost-import-upload" method="post" enctype="multipart/form-data"
      action="{{ url_for('ghost_admin.upload', site_slug=site_slug) }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

  <p>
    <label for="ghost-file">Ghost export file (.json or .zip):</label><br>
    <input type="file" id="ghost-file" name="file" accept=".json,.zip" required>
  </p>

  <button type="submit">Upload and review</button>
</form>
{% endblock %}
