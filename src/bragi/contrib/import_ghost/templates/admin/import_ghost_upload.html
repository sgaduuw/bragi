{% extends "admin/base.html" %}
{% block title %}Import from Ghost &middot; bragi admin{% endblock %}
{% block content %}
<h1>Import from Ghost</h1>

<p>Upload your Ghost JSON export or a ZIP containing it. You will be
   taken to a review page before anything is written to the database.</p>

<form method="post" enctype="multipart/form-data"
      action="{{ url_for('ghost_admin.upload', site_slug=site_slug) }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

  <p>
    <label for="ghost-file">Ghost export file (.json or .zip):</label><br>
    <input type="file" id="ghost-file" name="file" accept=".json,.zip" required>
  </p>

  <button type="submit">Upload and review</button>
</form>
{% endblock %}
