{# Inline-edit slug cell for pages. #}
<td id="page-slug-cell-{{ page.id }}"
    class="is-editable{% if mode == 'edit' %} is-editing{% endif %}"
    tabindex="0"
    role="gridcell"
    hx-get="{{ url_for('page_admin.slug_cell', site_slug=site.slug, page_id=page.id, mode='edit') }}"
    hx-target="this"
    hx-swap="outerHTML"
    hx-trigger="dblclick, keyup[key=='Enter']">
  {% if mode == 'edit' %}
    <form hx-patch="{{ url_for('page_admin.patch_slug', site_slug=site.slug, page_id=page.id) }}"
          hx-target="#page-slug-cell-{{ page.id }}"
          hx-swap="outerHTML"
          style="margin: 0;">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="slug" value="{{ value if value is not none else page.slug }}"
             autofocus required maxlength="255"
             hx-get="{{ url_for('page_admin.slug_cell', site_slug=site.slug, page_id=page.id, mode='view') }}"
             hx-target="closest td"
             hx-swap="outerHTML"
             hx-trigger="keyup[key=='Escape']">
      {% if error %}<div class="inline-edit-error">{{ error }}</div>{% endif %}
      <div class="inline-edit-hint">&#9166; save &middot; esc cancel</div>
    </form>
  {% else %}
    <code>{{ page.slug }}</code>
  {% endif %}
</td>
