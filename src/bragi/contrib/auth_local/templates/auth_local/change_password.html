<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change password &middot; bragi admin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 22rem;
      margin: 4rem auto;
      padding: 0 1rem;
      color: #222;
    }
    h1 { margin-bottom: 0.5rem; font-size: 1.25rem; }
    p.lede { color: #555; font-size: 0.9em; margin-bottom: 1.25rem; }
    form { display: flex; flex-direction: column; gap: 0.75rem; }
    label { font-weight: 600; font-size: 0.9em; }
    input {
      padding: 0.5rem;
      font-size: 1em;
      border: 1px solid #bbb;
      border-radius: 4px;
    }
    button {
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-size: 1em;
      background: #222;
      color: #fff;
      border: 0;
      border-radius: 4px;
    }
    button:hover { background: #444; }
    .flash {
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .flash.error { background: #fde2e2; color: #8a1f1f; }
    .flash.success { background: #e3f5e1; color: #1f5a2a; }
  </style>
</head>
<body>
  <h1>Change password</h1>
  <p class="lede">Your account requires a password rotation before
     you can continue.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('auth_local.change_password') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">Current password</label>
    <input type="password" name="current_password" id="current_password" required autofocus>
    <label for="new_password">New password</label>
    <input type="password" name="new_password" id="new_password" required minlength="12">
    <label for="confirm_password">Confirm new password</label>
    <input type="password" name="confirm_password" id="confirm_password" required minlength="12">
    <button type="submit">Update password</button>
  </form>
</body>
</html>
