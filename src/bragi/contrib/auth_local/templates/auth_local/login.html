<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in &middot; bragi admin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 22rem;
      margin: 4rem auto;
      padding: 0 1rem;
      color: #222;
    }
    h1 { margin-bottom: 1rem; font-size: 1.25rem; }
    form { display: flex; flex-direction: column; gap: 0.75rem; }
    label { font-weight: 600; font-size: 0.9em; }
    input {
      padding: 0.5rem;
      font-size: 1em;
      border: 1px solid #bbb;
      border-radius: 4px;
    }
    button {
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-size: 1em;
      background: #222;
      color: #fff;
      border: 0;
      border-radius: 4px;
    }
    button:hover { background: #444; }
    .oauth-sep {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: #888;
      font-size: 0.85em;
    }
    .oauth-sep::before, .oauth-sep::after {
      content: "";
      flex: 1;
      border-top: 1px solid #ddd;
    }
    .oauth-btn {
      display: block;
      text-align: center;
      padding: 0.6rem 1rem;
      border: 1px solid #bbb;
      border-radius: 4px;
      color: #222;
      text-decoration: none;
      font-weight: 600;
    }
    .oauth-btn:hover { background: #f3f3f3; }
    .flash {
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .flash.error { background: #fde2e2; color: #8a1f1f; }
    .flash.success { background: #e3f5e1; color: #1f5a2a; }
  </style>
</head>
<body>
  <h1>bragi admin</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('auth_local.login') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" required autofocus value="{{ email }}">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required>
    <button type="submit">Log in</button>
  </form>

  {% if oauth_providers %}
  <div class="oauth-sep"><span>or</span></div>
  {% for p in oauth_providers %}
    <a class="oauth-btn" href="{{ url_for(p.login_endpoint, next=next) }}">Sign in with {{ p.label }}</a>
  {% endfor %}
  {% endif %}
</body>
</html>
