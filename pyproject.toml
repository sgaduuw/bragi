[project]
# Distribution name is `bragi-cms` because the `bragi` name on PyPI
# is held by The Managarm Project's IDL. Import path stays `import bragi`.
# See _claude/CONTEXT.md "PyPI publication as bragi-cms" for the rationale.
name = "bragi-cms"
version = "1.34.1"
description = "Multisite CMS with htmx, plugins, and SEO baked in."
authors = [{name = "Eelco Wesemann", email = "6771014+sgaduuw@users.noreply.github.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "flask (>=3.0,<4.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.13,<2.0)",
    "pluggy (>=1.5,<2.0)",
    "pydantic-settings (>=2.2,<3.0)",
    "authlib (>=1.3,<2.0)",
    "argon2-cffi (>=25.1,<26.0)",
    "markdown-it-py (>=4.2,<5.0)",
    "mdit-py-plugins (>=0.6,<0.7)",
    "pygments (>=2.18,<3.0)",
    "markdownify (>=1.2,<2.0)",
    "click (>=8.1,<9.0)",
    "requests (>=2.34.1,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "pillow-avif-plugin (>=1.4,<2.0)",
    "gunicorn (>=26.0,<27.0)",
    "cryptography (>=48.0,<49.0)",
    "duckdb>=1.3,<2.0",
]

[project.urls]
homepage = "https://github.com/sgaduuw/bragi"
repository = "https://github.com/sgaduuw/bragi"

[project.scripts]
bragi          = "bragi.cli:bragi"
bragi-admin    = "bragi.apps.admin:run"
bragi-delivery = "bragi.apps.delivery:run"

# Plugin entry-point group: built-ins are activated here. Comment
# a line to disable a built-in (it stays on disk; just doesn't
# register on app boot).
[project.entry-points."bragi.plugins"]
post = "bragi.contrib.post.plugin"
page = "bragi.contrib.page.plugin"
nav = "bragi.contrib.nav.plugin"
redirects = "bragi.contrib.redirects.plugin"
auth_local = "bragi.contrib.auth_local.plugin"
auth_github = "bragi.contrib.auth_github.plugin"
sites = "bragi.contrib.sites.plugin"
team = "bragi.contrib.team.plugin"
sessions = "bragi.contrib.sessions.plugin"
audit = "bragi.contrib.audit.plugin"
attachments = "bragi.contrib.attachments.plugin"
highlight = "bragi.contrib.highlight.plugin"
anchors = "bragi.contrib.anchors.plugin"
seo = "bragi.contrib.seo.plugin"
analytics = "bragi.contrib.analytics.plugin"
import_hugo = "bragi.contrib.import_hugo.plugin"
import_ghost = "bragi.contrib.import_ghost.plugin"
import_wordpress = "bragi.contrib.import_wordpress.plugin"
import_linkedin = "bragi.contrib.import_linkedin.plugin"
indexnow = "bragi.contrib.indexnow.plugin"
search = "bragi.contrib.search.plugin"
themes = "bragi.contrib.themes.plugin"
theme_default = "bragi.contrib.theme_default.plugin"
theme_minimal = "bragi.contrib.theme_minimal.plugin"
theme_serif = "bragi.contrib.theme_serif.plugin"
theme_terminal = "bragi.contrib.theme_terminal.plugin"
embeds = "bragi.contrib.embeds.plugin"
datasets = "bragi.contrib.datasets.plugin"
internal_links = "bragi.contrib.internal_links.plugin"
markdown_extras = "bragi.contrib.markdown_extras.plugin"
api_tokens = "bragi.contrib.api_tokens.plugin"
webmentions = "bragi.contrib.webmentions.plugin"
activitypub = "bragi.contrib.activitypub.plugin"
admin_imports = "bragi.contrib.admin_imports.plugin"
admin_notices = "bragi.contrib.admin_notices.plugin"
unsplash = "bragi.contrib.unsplash.plugin"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.14,<0.16",
    "mypy>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit src-layout wheel target: tells hatchling where the
# importable package lives so it does not fall back to project-root
# discovery (which would miss the src/ prefix).
[tool.hatch.build.targets.wheel]
packages = ["src/bragi"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "SIM",          # flake8-simplify
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# Hookspec functions are stubs: pluggy replaces them with a
# dispatcher at registration time. mypy's empty-body check would
# otherwise fire on every spec that returns a non-None concrete
# type, even with the `...` stub idiom.
[[tool.mypy.overrides]]
module = "bragi.hookspecs"
disable_error_code = ["empty-body"]

# Alembic migration scripts are generated code. They predate the
# move of alembic/ into src/bragi/ and were never written for
# strict mypy. The env.py has one intentional None assignment for
# the pre-import fallback. Exclude the whole subtree rather than
# annotate generated scripts.
[[tool.mypy.overrides]]
module = ["bragi.alembic.*", "bragi.alembic.env", "bragi.alembic.versions.*"]
ignore_errors = true

# Libraries without type stubs.
[[tool.mypy.overrides]]
module = ["pygments.*", "authlib.*", "yaml", "markdownify"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
