[project]
name = "bragi"
version = "1.12.0"
description = "Multisite CMS with htmx, plugins, and SEO baked in."
authors = [{name = "Eelco Wesemann", email = "6771014+sgaduuw@users.noreply.github.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4"
# Not published to PyPI; ship via Docker on GHCR. The `bragi`
# distribution name is held by an unrelated project.
dependencies = [
    "flask (>=3.0,<4.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.13,<2.0)",
    "pluggy (>=1.5,<2.0)",
    "pydantic-settings (>=2.2,<3.0)",
    "authlib (>=1.3,<2.0)",
    "argon2-cffi (>=23.1,<24.0)",
    "markdown-it-py (>=3.0,<4.0)",
    "mdit-py-plugins (>=0.4,<0.5)",
    "pygments (>=2.18,<3.0)",
    "markdownify (>=0.13,<0.14)",
    "click (>=8.1,<9.0)",
    "requests (>=2.34.1,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "gunicorn (>=23.0,<24.0)",
    "cryptography (>=48.0,<49.0)",
]

[project.urls]
homepage = "https://github.com/sgaduuw/bragi"
repository = "https://github.com/sgaduuw/bragi"

[project.scripts]
bragi-admin    = "bragi.apps.admin:run"
bragi-delivery = "bragi.apps.delivery:run"

# Plugin entry-point group: built-ins are activated here. Comment
# a line to disable a built-in (it stays on disk; just doesn't
# register on app boot).
[project.entry-points."bragi.plugins"]
post = "bragi.contrib.post.plugin"
page = "bragi.contrib.page.plugin"
redirects = "bragi.contrib.redirects.plugin"
auth_local = "bragi.contrib.auth_local.plugin"
auth_github = "bragi.contrib.auth_github.plugin"
sites = "bragi.contrib.sites.plugin"
team = "bragi.contrib.team.plugin"
sessions = "bragi.contrib.sessions.plugin"
audit = "bragi.contrib.audit.plugin"
attachments = "bragi.contrib.attachments.plugin"
highlight = "bragi.contrib.highlight.plugin"
anchors = "bragi.contrib.anchors.plugin"
seo = "bragi.contrib.seo.plugin"
analytics = "bragi.contrib.analytics.plugin"
import_hugo = "bragi.contrib.import_hugo.plugin"
import_ghost = "bragi.contrib.import_ghost.plugin"
import_wordpress = "bragi.contrib.import_wordpress.plugin"
indexnow = "bragi.contrib.indexnow.plugin"
search = "bragi.contrib.search.plugin"
themes = "bragi.contrib.themes.plugin"
theme_default = "bragi.contrib.theme_default.plugin"
embeds = "bragi.contrib.embeds.plugin"
internal_links = "bragi.contrib.internal_links.plugin"
markdown_extras = "bragi.contrib.markdown_extras.plugin"
api_tokens = "bragi.contrib.api_tokens.plugin"
webmentions = "bragi.contrib.webmentions.plugin"
activitypub = "bragi.contrib.activitypub.plugin"

# Poetry-specific build layout: src-layout package discovery. PEP
# 621 has no portable equivalent for this; stays in `[tool.poetry]`.
[tool.poetry]
packages = [{include = "bragi", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.5"
mypy = "^1.10"
honcho = "^1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "SIM",          # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# Hookspec functions are stubs: pluggy replaces them with a
# dispatcher at registration time. mypy's empty-body check would
# otherwise fire on every spec that returns a non-None concrete
# type, even with the `...` stub idiom.
[[tool.mypy.overrides]]
module = "bragi.hookspecs"
disable_error_code = ["empty-body"]

# Libraries without type stubs.
[[tool.mypy.overrides]]
module = ["pygments.*", "authlib.*", "yaml", "markdownify"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
