# Example docker compose for bragi.
#
# Pulls the published images from GHCR rather than building from
# source. The tag is parameterised via `BRAGI_TAG` (default
# `latest`); pin to a specific release in production:
#
#   BRAGI_TAG=v1.6.0 docker compose up -d
#
# Companion file `docker/compose.dev.yml` builds the images
# locally instead, for testing the container shape without a
# GHCR pull.
#
# A reverse proxy in front (Caddy / nginx / Traefik) terminates
# TLS and maps your real hostnames onto the admin (8001) and
# delivery (8002) ports. The publish addresses bind to 127.0.0.1
# so nothing reaches the public interface unless the proxy
# routes it there.

services:
  # Task-runner sidecar. Owns `alembic upgrade head` on start
  # (touches /data/.migrated once the schema is current), then
  # enters a sleeper loop dispatching
  # `flask --app 'bragi.apps.admin:create_admin_app' cms ...` commands
  # at configured cadences: scheduled-publish (flips due drafts
  # to published), embeds rerender-pending (retries failed embed
  # cards), webmentions send-pending (ships queued outbound
  # webmentions), activitypub send-pending (delivers signed AP
  # activities), db analyze (daily), db vacuum (weekly). See
  # docker/scheduler.sh for the loop body and the env-overridable
  # cadence knobs (SCHEDULED_PUBLISH_EVERY, EMBEDS_RERENDER_EVERY,
  # WEBMENTIONS_SEND_EVERY, ACTIVITYPUB_SEND_EVERY, ANALYZE_EVERY,
  # VACUUM_EVERY, all in seconds).
  #
  # Reuses the bragi-admin image since the `cms` CLI is registered
  # on the admin app. Web containers gate their start on this
  # sidecar's healthcheck so gunicorn doesn't serve requests
  # against an unmigrated DB on a fresh /data volume.
  bragi-tasks:
    image: ghcr.io/sgaduuw/bragi-admin:${BRAGI_TAG:-latest}
    command: ["/app/scheduler.sh"]
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      # Cadence overrides (all in seconds). Leave commented for
      # the defaults defined in docker/scheduler.sh.
      # SCHEDULED_PUBLISH_EVERY: "60"
      # EMBEDS_RERENDER_EVERY: "600"
      # WEBMENTIONS_SEND_EVERY: "300"
      # ACTIVITYPUB_SEND_EVERY: "60"
      # ANALYZE_EVERY: "86400"
      # VACUUM_EVERY: "604800"
    volumes:
      - bragi-data:/data
    restart: unless-stopped
    healthcheck:
      # Sentinel touched by scheduler.sh after a successful
      # `alembic upgrade head`. Web containers gate on this via
      # depends_on.condition: service_healthy.
      test: ["CMD", "test", "-f", "/data/.migrated"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 0s

  admin:
    image: ghcr.io/sgaduuw/bragi-admin:${BRAGI_TAG:-latest}
    depends_on:
      bragi-tasks:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # Required.
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
      # Tells the app it's running in production. With this set,
      # `create_admin_app` refuses to start if `BRAGI_SECRET_KEY`
      # is the bundled dev sentinel; without it the dev default
      # produces a startup WARNING instead. Set to `production`
      # for any real deploy; leave unset for local dev.
      BRAGI_ENV: production
      # Optional (uncomment + populate to enable).
      # BRAGI_GITHUB_CLIENT_ID: ...
      # BRAGI_GITHUB_CLIENT_SECRET: ...
      # BRAGI_SECURITY_CONTACT: mailto:security@example.com
      # Hard cap on inbound request body size. Admin defaults to
      # `max(max_request_bytes, attachments_max_bytes + 64 KiB)`
      # so attachment uploads up to `attachments_max_bytes` (20
      # MiB default) work; override here to raise the cap for
      # both federation inboxes and attachment uploads.
      # BRAGI_MAX_REQUEST_BYTES: "1048576"
      # BRAGI_ATTACHMENTS_MAX_BYTES: "20971520"
      # Gunicorn worker count for the admin app. Default 2; admin
      # is low-concurrency (one operator). Dial up if you have
      # multiple authors hitting it concurrently.
      # ADMIN_WORKERS: "2"
    volumes:
      - bragi-data:/data
    restart: unless-stopped
    healthcheck:
      # `/healthz` returns 200 + a `SELECT 1` round-trip so a
      # wedged worker (or a DB the worker can't read) flips the
      # container to unhealthy and restart-on-failure kicks in.
      # Uses python's stdlib `urllib` (in the image already)
      # rather than depending on curl in the slim runtime.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  delivery:
    image: ghcr.io/sgaduuw/bragi-delivery:${BRAGI_TAG:-latest}
    depends_on:
      bragi-tasks:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
      BRAGI_ENV: production
      # BRAGI_SECURITY_CONTACT: mailto:security@example.com
      # Hard cap on inbound request body size; protects federation
      # inboxes (`/webmentions`, `/actor/inbox`) from streaming-
      # body OOM. Delivery doesn't accept attachment uploads, so
      # 1 MiB is appropriate.
      # BRAGI_MAX_REQUEST_BYTES: "1048576"
      # Gunicorn worker count for the delivery app. Default 4;
      # delivery is read-heavy and SQLite WAL keeps reads parallel.
      # Dial up on high-traffic public sites, down on small VPS.
      # DELIVERY_WORKERS: "4"
    volumes:
      - bragi-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Shared between all three services: SQLite DB at /data/bragi.db,
  # the migrate-sentinel /data/.migrated touched by bragi-tasks,
  # and uploaded attachments under /data/uploads/. Back this up.
  bragi-data:
