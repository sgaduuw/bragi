# Example docker compose for bragi.
#
# Pulls the published images from GHCR rather than building from
# source. The tag is parameterised via `BRAGI_TAG` (default
# `latest`); pin to a specific release in production:
#
#   BRAGI_TAG=v1.6.0 docker compose up -d
#
# Companion file `docker/compose.dev.yml` builds the images
# locally instead, for testing the container shape without a
# GHCR pull.
#
# A reverse proxy in front (Caddy / nginx / Traefik) terminates
# TLS and maps your real hostnames onto the admin (8001) and
# delivery (8002) ports. The publish addresses bind to 127.0.0.1
# so nothing reaches the public interface unless the proxy
# routes it there.

services:
  # Task-runner sidecar. Owns `alembic upgrade head` on start
  # (touches /data/.migrated once the schema is current), then
  # enters a sleeper loop dispatching
  # `flask --app 'bragi.apps.admin:create_admin_app' cms ...` commands
  # at configured cadences: scheduled-publish
  # (flips due drafts to published), db analyze (daily), db vacuum
  # (weekly). See docker/scheduler.sh for the loop body and the
  # env-overridable cadence knobs (SCHEDULED_PUBLISH_EVERY,
  # ANALYZE_EVERY, VACUUM_EVERY, all in seconds).
  #
  # Reuses the bragi-admin image since the `cms` CLI is registered
  # on the admin app. Web containers gate their start on this
  # sidecar's healthcheck so gunicorn doesn't serve requests
  # against an unmigrated DB on a fresh /data volume.
  bragi-tasks:
    image: ghcr.io/sgaduuw/bragi-admin:${BRAGI_TAG:-latest}
    command: ["/app/scheduler.sh"]
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      # Cadence overrides (all in seconds). Leave commented for
      # the defaults defined in docker/scheduler.sh.
      # SCHEDULED_PUBLISH_EVERY: "60"
      # ANALYZE_EVERY: "86400"
      # VACUUM_EVERY: "604800"
    volumes:
      - bragi-data:/data
    restart: unless-stopped
    healthcheck:
      # Sentinel touched by scheduler.sh after a successful
      # `alembic upgrade head`. Web containers gate on this via
      # depends_on.condition: service_healthy.
      test: ["CMD", "test", "-f", "/data/.migrated"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 0s

  admin:
    image: ghcr.io/sgaduuw/bragi-admin:${BRAGI_TAG:-latest}
    depends_on:
      bragi-tasks:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # Required.
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
      # Optional (uncomment + populate to enable).
      # BRAGI_GITHUB_CLIENT_ID: ...
      # BRAGI_GITHUB_CLIENT_SECRET: ...
      # BRAGI_SECURITY_CONTACT: mailto:security@example.com
      # Gunicorn worker count for the admin app. Default 2; admin
      # is low-concurrency (one operator). Dial up if you have
      # multiple authors hitting it concurrently.
      # ADMIN_WORKERS: "2"
    volumes:
      - bragi-data:/data
    restart: unless-stopped

  delivery:
    image: ghcr.io/sgaduuw/bragi-delivery:${BRAGI_TAG:-latest}
    depends_on:
      bragi-tasks:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
      # BRAGI_SECURITY_CONTACT: mailto:security@example.com
      # Gunicorn worker count for the delivery app. Default 4;
      # delivery is read-heavy and SQLite WAL keeps reads parallel.
      # Dial up on high-traffic public sites, down on small VPS.
      # DELIVERY_WORKERS: "4"
    volumes:
      - bragi-data:/data
    restart: unless-stopped

volumes:
  # Shared between all three services: SQLite DB at /data/bragi.db,
  # the migrate-sentinel /data/.migrated touched by bragi-tasks,
  # and uploaded attachments under /data/uploads/. Back this up.
  bragi-data:
