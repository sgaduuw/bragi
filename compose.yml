# Example docker compose for bragi.
#
# Pulls the published images from GHCR rather than building from
# source. The tag is parameterised via `BRAGI_TAG` (default
# `latest`); pin to a specific release in production:
#
#   BRAGI_TAG=v1.11.0 docker compose up -d
#
# Companion file `docker/compose.dev.yml` builds the images
# locally instead, for testing the container shape without a
# GHCR pull.
#
# A reverse proxy in front (Caddy / nginx / Traefik) terminates
# TLS and maps your real hostnames onto the admin (8001) and
# delivery (8002) ports. The publish addresses bind to 127.0.0.1
# so nothing reaches the public interface unless the proxy
# routes it there.

services:
  # Task-runner sidecar. Owns `alembic upgrade head` on start
  # (touches /data/.migrated once the schema is current), then
  # enters a sleeper loop dispatching
  # `flask --app 'bragi.apps.admin:create_admin_app' cms ...` commands
  # at configured cadences: scheduled-publish (flips due drafts
  # to published), embeds rerender-pending (retries failed embed
  # cards), webmentions send-pending (ships queued outbound
  # webmentions), activitypub send-pending (delivers signed AP
  # activities), db analyze (daily), db vacuum (weekly). See
  # docker/scheduler.sh for the loop body and the env-overridable
  # cadence knobs (SCHEDULED_PUBLISH_EVERY, EMBEDS_RERENDER_EVERY,
  # WEBMENTIONS_SEND_EVERY, ACTIVITYPUB_SEND_EVERY, ANALYZE_EVERY,
  # VACUUM_EVERY, all in seconds).
  #
  # Reuses the bragi-admin image since the `cms` CLI is registered
  # on the admin app. Web containers gate their start on this
  # sidecar's healthcheck so gunicorn doesn't serve requests
  # against an unmigrated DB on a fresh /data volume.
  bragi-tasks:
    image: ghcr.io/sgaduuw/bragi-admin:${BRAGI_TAG:-latest}
    command: ["/app/scheduler.sh"]
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
      # The scheduler boots through `create_admin_app`, which
      # refuses to start with the bundled dev `SECRET_KEY` sentinel
      # when `BRAGI_ENV=production`. Match the gunicorn services so
      # a mis-set secret fails the sidecar's first migration tick
      # rather than silently running with a dev key.
      BRAGI_ENV: production
      # Cadence overrides (all in seconds). Leave commented for
      # the defaults defined in docker/scheduler.sh.
      # SCHEDULED_PUBLISH_EVERY: "60"
      # EMBEDS_RERENDER_EVERY: "600"
      # WEBMENTIONS_SEND_EVERY: "300"
      # ACTIVITYPUB_SEND_EVERY: "60"
      # ANALYZE_EVERY: "86400"
      # VACUUM_EVERY: "604800"
    volumes:
      - bragi-data:/data
    # `on-failure` (not `unless-stopped`) so a deliberate exit 0
    # from scheduler.sh (after `ALEMBIC_MAX_ATTEMPTS` failed
    # migration attempts) terminates the restart loop rather than
    # bouncing forever. Without this, a broken migration deploys
    # as a livelocked "half-up" state with no clear failure signal.
    restart: on-failure
    healthcheck:
      # Sentinel touched by scheduler.sh after a successful
      # `alembic upgrade head`. Web containers gate on this via
      # depends_on.condition: service_healthy.
      test: ["CMD", "test", "-f", "/data/.migrated"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 0s

  admin:
    image: ghcr.io/sgaduuw/bragi-admin:${BRAGI_TAG:-latest}
    depends_on:
      bragi-tasks:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    # `stop_grace_period` matches gunicorn's `--graceful-timeout 25`
    # (with 5s slack) so an in-flight outbound POST (webmention,
    # AP delivery) has time to return before SIGKILL fires.
    stop_grace_period: 30s
    environment:
      # Required deploy posture. `BRAGI_ENV=production` makes the
      # dev SECRET_KEY sentinel fatal; `BRAGI_TRUSTED_PROXY_HOPS=1`
      # tells ProxyFix to trust one hop of X-Forwarded-* headers
      # from the TLS-terminating reverse proxy. See README
      # "Container runtime hardening" and `bragi/settings.py`
      # field comments for the full rationale.
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
      BRAGI_ENV: production
      BRAGI_TRUSTED_PROXY_HOPS: "1"
      # Optional knobs (uncomment to enable). Each maps to a
      # `Settings` field documented in `src/bragi/settings.py`.
      # BRAGI_GITHUB_CLIENT_ID: ...
      # BRAGI_GITHUB_CLIENT_SECRET: ...
      # BRAGI_SECURITY_CONTACT: mailto:security@example.com
      # BRAGI_SECURITY_EXPIRES_DAYS: "365"
      # BRAGI_MAX_REQUEST_BYTES: "1048576"
      # BRAGI_ATTACHMENTS_MAX_BYTES: "20971520"
      # BRAGI_ATTACHMENT_RENDITION_WIDTHS: "[320,800,1600]"
      # BRAGI_EMBED_YOUTUBE_MODE: "click-to-load"
      # BRAGI_EMBED_OEMBED_TIMEOUT_PER: "2.0"
      # BRAGI_EMBED_OEMBED_TIMEOUT_AGGREGATE: "5.0"
      # BRAGI_EMBED_RERENDER_TIMEOUT_PER: "15.0"
      # BRAGI_INDEXNOW_ENDPOINT: "https://api.indexnow.org/indexnow"
      # Unsplash plugin. Set BRAGI_UNSPLASH_ACCESS_KEY to enable
      # the Unsplash tab in the admin attachments picker (also
      # surfaced by the TipTap "Insert image" button, which opens
      # the same picker). Get a key from
      # https://unsplash.com/developers. Empty / unset = plugin
      # loads but the picker tab stays hidden and the search /
      # select routes return 400. The delivery container does not
      # need this key (credit captions render from stored
      # attachment metadata, not from Unsplash API calls).
      # BRAGI_UNSPLASH_ACCESS_KEY: ${BRAGI_UNSPLASH_ACCESS_KEY:-}
      # BRAGI_UNSPLASH_APP_NAME (default "bragi") is the utm_source
      # tag on photographer-credit links; match it across admin and
      # delivery if you customise so rendered credit URLs stay
      # consistent.
      # BRAGI_UNSPLASH_APP_NAME: "bragi"
      # ADMIN_WORKERS: "2"
    volumes:
      - bragi-data:/data
    restart: unless-stopped
    healthcheck:
      # `/healthz` returns 200 + a `SELECT 1` round-trip so a
      # wedged worker (or a DB the worker can't read) flips the
      # container to unhealthy and restart-on-failure kicks in.
      # Uses python's stdlib `urllib` (in the image already)
      # rather than depending on curl in the slim runtime.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  delivery:
    image: ghcr.io/sgaduuw/bragi-delivery:${BRAGI_TAG:-latest}
    depends_on:
      bragi-tasks:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
    stop_grace_period: 30s
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: ${BRAGI_SECRET_KEY:?set BRAGI_SECRET_KEY in your environment or .env file}
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
      BRAGI_ENV: production
      BRAGI_TRUSTED_PROXY_HOPS: "1"
      # Optional knobs (see `src/bragi/settings.py` for field docs).
      # BRAGI_SECURITY_CONTACT: mailto:security@example.com
      # BRAGI_MAX_REQUEST_BYTES: "1048576"
      # BRAGI_UNSPLASH_APP_NAME (default "bragi") affects the
      # utm_source tag on photographer-credit links rendered at
      # delivery time. Set on both admin and delivery if you
      # customise so credit URLs match the ones admin generates
      # when picking. The Unsplash access key is NOT needed here;
      # credit captions render from the stored attachment
      # metadata, not from Unsplash API calls.
      # BRAGI_UNSPLASH_APP_NAME: "bragi"
      # DELIVERY_WORKERS: "4"
    volumes:
      - bragi-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Shared between all three services: SQLite DB at /data/bragi.db,
  # the migrate-sentinel /data/.migrated touched by bragi-tasks,
  # and uploaded attachments under /data/uploads/. Back this up.
  bragi-data:
