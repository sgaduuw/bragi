# Optional local stack via docker compose. The primary dev path is
# `make dev` (an in-repo Procfile supervisor runs admin + delivery +
# the dev-tasks loop in your venv); this file is for testing the
# prod container shape locally.
services:
  bragi-tasks:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
    command: ["/app/scheduler.sh"]
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: dev-only-change-in-production
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
      # `BRAGI_ENV` deliberately unset in this dev compose file:
      # the SECRET_KEY above is the bundled dev sentinel and
      # production-mode boot would refuse to start. The web
      # services below mirror this. The production compose.yml
      # (../compose.yml) sets BRAGI_ENV=production on all three
      # services.
      # `BRAGI_TRUSTED_PROXY_HOPS` deliberately unset (defaults to
      # 0): the dev stack has no reverse proxy. The production
      # compose.yml sets it to 1.
    volumes:
      - bragi-data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/data/.migrated"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 0s

  admin:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
    depends_on:
      bragi-tasks:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: dev-only-change-in-production
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
    volumes:
      - bragi-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  delivery:
    build:
      context: ..
      dockerfile: docker/delivery.Dockerfile
    depends_on:
      bragi-tasks:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      BRAGI_DATABASE_URL: sqlite:////data/bragi.db
      BRAGI_SECRET_KEY: dev-only-change-in-production
      BRAGI_ATTACHMENTS_ROOT: /data/uploads
    volumes:
      - bragi-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bragi-data:
